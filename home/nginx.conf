server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # API GATEWAY
    # =========================
    # Todas las peticiones /api/... pasan por el API Gateway, que es el
    # único punto de entrada hacia los microservicios (usuarios,
    # autenticación, productos, pedidos y pagos).

    location /api/ {
        proxy_pass http://gateway:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # =========================
    # ERRORES DE API
    # =========================

    error_page 502 503 504 = @api_unavailable;

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"Servicio temporalmente no disponible","mensaje":"No se pudo conectar con el API Gateway. Verifica que el contenedor esté activo y vuelve a intentarlo."}';
    }
}
