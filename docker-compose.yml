services:
  home:
    build: ./home
    ports:
      - "3000:80"
    depends_on:
      - usuarios
      - productos
      - pedidos

  usuarios:
    build: ./servicios/usuarios
    ports:
      - "3001:5000"
    env_file:
      - ./servicios/usuarios/.env  
    depends_on:
      - db_usuarios

  db_usuarios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_usuarios
    ports:
      - "3308:3306"
    volumes:
      - db_usuarios:/var/lib/mysql  

  autenticacion:
    image: nginx:alpine
    ports:
      - "3002:80"
    depends_on:
      - db_autenticacion

  db_autenticacion:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_autenticacion

  productos:
    build: ./servicios/productos
    ports:
      - "3003:5000"
    env_file:
      - ./servicios/productos/.env
    depends_on:
      - db_productos

  db_productos:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_productos
    ports:
      - "3303:3306"
    volumes:
      - db_productos:/var/lib/mysql

  pedidos:
    build: ./servicios/pedidos
    ports:
      - "3004:5000"
    env_file:
      - ./servicios/pedidos/.env
    depends_on:
      - db_pedidos
      - usuarios
      - productos

  db_pedidos:
  image: mysql:8.0
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: db_pedidos
  ports:
    - "3304:3306"
  volumes:
    - db_pedidos:/var/lib/mysql

  pagos:
    image: nginx:alpine
    ports:
      - "3005:80"
    depends_on:
      - db_pagos

  db_pagos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pagos

  inventario:
    image: nginx:alpine
    ports:
      - "3006:80"
    depends_on:
      - db_inventario

  db_inventario:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_inventario

  notificaciones:
    image: nginx:alpine
    ports:
      - "3007:80"
    depends_on:
      - db_notificaciones

  db_notificaciones:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_notificaciones

volumes:
  db_pedidos:
  db_productos:
  db_usuarios:      