services:
  home:
    build: ./home
    ports:
      - "3000:80"
    depends_on:
      - usuarios
      - autenticacion
      - productos
      - pedidos
      - pagos

  usuarios:
    build: ./servicios/usuarios
    ports:
      - "3001:5000"
    env_file:
      - ./.env
    depends_on:
      - db_usuarios

  db_usuarios:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_usuarios
    ports:
      - "3308:3306"
    volumes:
      - db_usuarios:/var/lib/mysql

  autenticacion:
    build: ./servicios/autenticacion
    ports:
      - "3002:5000"
    env_file:
      - ./.env
    depends_on:
      - db_autenticacion
      - usuarios

  db_autenticacion:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_autenticacion
    ports:
      - "3302:3306"
    volumes:
      - db_autenticacion:/var/lib/mysql

  productos:
    build: ./servicios/productos
    ports:
      - "3003:5000"
    env_file:
      - ./.env
    depends_on:
      - db_productos

  db_productos:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_productos
    ports:
      - "3303:3306"
    volumes:
      - db_productos:/var/lib/mysql

  pedidos:
    build: ./servicios/pedidos
    ports:
      - "3004:5000"
    env_file:
      - ./.env
    depends_on:
      - db_pedidos
      - usuarios
      - productos

  db_pedidos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pedidos
    ports:
      - "3304:3306"
    volumes:
      - db_pedidos:/var/lib/mysql

  pagos:
    build: ./servicios/pagos
    ports:
      - "3005:5000"
    env_file:
      - ./.env
    depends_on:
      - db_pagos
      - pedidos

  db_pagos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pagos
    ports:
      - "3305:3306"
    volumes:
      - db_pagos:/var/lib/mysql

volumes:
  db_pedidos:
  db_productos:
  db_usuarios:
  db_autenticacion:
  db_pagos: